name: Generate VFR Map Tiles
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build_vfr_maps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        country: [finland, sweden, germany]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate VFR PMTiles with custom schema
        run: |
          docker run --rm \
            -e JAVA_TOOL_OPTIONS="-Xmx8g" \
            -v "${{ github.workspace }}:/data" \
            ghcr.io/onthegomap/planetiler:latest \
            generate-custom \
            --schema=/data/vfr_schema.yml \
            --area=geofabrik:${{ matrix.country }} \
            --output=/data/${{ matrix.country }}_vfr.pmtiles \
            --force

      - name: Verify PMTiles file
        run: |
          ls -lh ${{ matrix.country }}_vfr.pmtiles || exit 1

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vfr-maps-latest
          name: "Latest VFR Base Maps"
          files: ${{ matrix.country }}_vfr.pmtiles
          make_latest: true
