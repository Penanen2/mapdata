name: Generate VFR Map Tiles
on:
  workflow_dispatch:

permissions:
  contents: write # Antaa robotille luvan tallentaa kartat GitHub Releases -sivulle

jobs:
  build_vfr_maps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        country: [finland, sweden, germany]

    steps:
      - name: Download latest OSM data from Geofabrik
        run: |
          wget -qO raw.osm.pbf "https://download.geofabrik.de/europe/${{ matrix.country }}-latest.osm.pbf"

      - name: Install Osmium Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool

      - name: Filter out highway links (ramps) to reduce file size
        # Käytetään osmiumia poistamaan moottoritie- ja maantierampit (-i eli invert-match poistaa listatut kohteet)
        run: |
          osmium tags-filter -i raw.osm.pbf w/highway=motorway_link,trunk_link,primary_link,secondary_link -o cleaned.osm.pbf

      - name: Generate Clean VFR PMTiles with Planetiler
        # Syötetään Planetilerille cleaned.osm.pbf raakadatan sijaan
        run: |
          docker run --rm \
            -e JAVA_TOOL_OPTIONS="-Xmx5g" \
            -v "${{ github.workspace }}:/data" \
            ghcr.io/onthegomap/planetiler:latest \
            --download \
            --osm-path=/data/cleaned.osm.pbf \
            --output=/data/${{ matrix.country }}_vfr.pmtiles \
            --maxzoom=11 \
            --simplify-tolerance=1.0 \
            --exclude-layers=building,housenumber,park,mountain_peak,address \
            --fetch-wikidata=false \
            --force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vfr-maps-latest
          name: "Latest VFR Base Maps"
          files: ${{ matrix.country }}_vfr.pmtiles
          make_latest: true
