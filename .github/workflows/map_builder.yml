name: Generate VFR Base Map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Planetiler Custom Map
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/data \
            ghcr.io/onthegomap/planetiler:latest \
            custom \
            --schema=/data/schema/aerotools.yml \
            --download \
            --area=finland \
            --output=/data/finland.pmtiles \
            --force

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-vfr-map
          make_latest: true
          files: |
            finland.pmtiles
