name: Generate VFR Base Map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
 build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Download Finland
        run: |
          wget -O finland.osm.pbf \
          https://download.geofabrik.de/europe/finland-latest.osm.pbf

      - name: Run Planetiler
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/data \
            ghcr.io/onthegomap/planetiler:latest \
            --download=false \
            --osm-path=/data/finland.osm.pbf \
            --output=/data/finland.pmtiles \
            --force \
            --fetch-wikidata=false \
            --maxzoom=11

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-vfr-map
          make_latest: true
          files: |
            finland.pmtiles
