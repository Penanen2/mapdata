name: Generate VFR Map Tiles
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build_vfr_maps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        country: [finland]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download latest OSM data from Geofabrik
        run: |
          wget -qO raw.osm.pbf "https://download.geofabrik.de/europe/${{ matrix.country }}-latest.osm.pbf"

      - name: Install Osmium Tool, GDAL, and Tippecanoe
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool gdal-bin build-essential libsqlite3-dev zlib1g-dev
          git clone https://github.com/mapbox/tippecanoe.git
          cd tippecanoe && make && sudo make install && cd ..

      # ========== ROAD FILTERING ==========
      - name: Step 1 - Remove highway links (motorway_link, trunk_link, etc.)
        run: |
          osmium tags-filter -i raw.osm.pbf \
            w/highway=motorway_link,trunk_link,primary_link,secondary_link,tertiary_link \
            -o step1.osm.pbf

      - name: Step 2 - Remove service roads and tracks
        run: |
          osmium tags-filter -i step1.osm.pbf \
            w/highway=service,track \
            -o step2.osm.pbf

      - name: Step 3 - Remove roundabouts (interchange loops)
        run: |
          osmium tags-filter -i step2.osm.pbf \
            w/junction=roundabout \
            -o step3.osm.pbf

      - name: Step 4 - Remove secondary roads entirely (too detailed for VFR)
        run: |
          osmium tags-filter -i step3.osm.pbf \
            w/highway=secondary,secondary_link,tertiary,tertiary_link \
            -o cleaned.osm.pbf

      # ========== LANDUSE EXTRACTION ==========
      - name: Extract landuse polygons using osmium (multipolygons only)
        run: |
          osmium tags-filter -o landuse_raw.osm.pbf cleaned.osm.pbf \
            relation/type=multipolygon/landuse=residential,commercial,industrial,retail

      - name: Convert extracted multipolygons to GeoJSON
        run: |
          ogr2ogr -f GeoJSON landuse_raw.geojson landuse_raw.osm.pbf multipolygons \
            -sql "SELECT * FROM multipolygons WHERE landuse IS NOT NULL"

      - name: Verify GeoJSON is not empty
        run: |
          FEATURE_COUNT=$(jq '.features | length' landuse_raw.geojson 2>/dev/null || echo 0)
          echo "Extracted $FEATURE_COUNT landuse polygons"
          if [ "$FEATURE_COUNT" -eq 0 ]; then
            echo "WARNING: No landuse features extracted! Proceeding anyway (will generate empty landuse tileset)."
          fi

      - name: Install Node + mapshaper
        run: |
          sudo npm install -g mapshaper

      - name: Dissolve adjacent polygons and simplify
        run: |
          if [ -f landuse_raw.geojson ]; then
            mapshaper landuse_raw.geojson \
              -dissolve2 fields=landuse \
              -simplify 15% \
              -o merged_landuse.geojson format=geojson
          else
            echo '{"type":"FeatureCollection","features":[]}' > merged_landuse.geojson
          fi

      # ========== MAIN VFR BASEMAP (cleaned roads, no secondary, no landuse) ==========
      - name: Generate main VFR PMTiles with Planetiler
        run: |
          docker run --rm \
            -e JAVA_TOOL_OPTIONS="-Xmx5g" \
            -v "${{ github.workspace }}:/data" \
            ghcr.io/onthegomap/planetiler:latest \
            --download \
            --osm-path=/data/cleaned.osm.pbf \
            --output=/data/${{ matrix.country }}_vfr.pmtiles \
            --maxzoom=11 \
            --simplify-tolerance=1.0 \
            --exclude-layers=building,housenumber,park,mountain_peak,address,landuse,water_name,poi,aeroway \
            --fetch-wikidata=false \
            --force

      # ========== DISSOLVED LANDUSE TILESET WITH TIPPECANOE ==========
      - name: Generate dissolved landuse PMTiles with Tippecanoe
        run: |
          tippecanoe \
            -o ${{ matrix.country }}_landuse.pmtiles \
            -l landuse_merged \
            -z 11 \
            -Z 0 \
            --drop-densest-as-needed \
            --no-bounding-box-index \
            merged_landuse.geojson

      - name: Verify both PMTiles files exist
        run: |
          ls -lh ${{ matrix.country }}_vfr.pmtiles ${{ matrix.country }}_landuse.pmtiles || exit 1

      - name: Upload both PMTiles to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vfr-maps-latest
          name: "Latest VFR Base Maps"
          files: |
            ${{ matrix.country }}_vfr.pmtiles
            ${{ matrix.country }}_landuse.pmtiles
          make_latest: true
