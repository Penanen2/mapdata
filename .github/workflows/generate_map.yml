name: Generate AeroTools VFR Maps & Obstacles

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: write

jobs:
  build_maps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - country: finland
            code: ef

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install osmium

      - name: Create Data Directory
        run: mkdir -p data

      - name: Download Planetiler Standalone Jar
        run: |
          wget -qO planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      - name: Download OSM Data from Geofabrik
        run: |
          wget -qO data/raw.osm.pbf "https://download.geofabrik.de/europe/${{ matrix.country }}-latest.osm.pbf"

      - name: Download Ocean Polygons
        run: |
          wget -qO data/water-polygons-split-4326.zip https://osmdata.openstreetmap.de/download/water-polygons-split-4326.zip

      - name: Generate Clean PMTiles
        env:
          MAP_COUNTRY: ${{ matrix.country }}
        run: |
          java -cp planetiler.jar AeroToolsProfile.java

      - name: Extract & Filter ICAO Obstacles from local OSM PBF
        run: |
          python - << 'EOF'
          import json, osmium

          class ObstacleHandler(osmium.SimpleHandler):
              def __init__(self):
                  super().__init__()
                  self.features = []

              def node(self, n):
                  tags = {t.k: t.v for t in n.tags}
                  man_made = tags.get('man_made')
                  power = tags.get('power')
                  gen_source = tags.get('generator:source')
                  aeroway = tags.get('aeroway')

                  is_obstacle = (
                      man_made in ('mast', 'tower', 'chimney', 'communications_tower') or
                      gen_source == 'wind' or
                      aeroway == 'obstacle' or
                      (power == 'tower' and ('height' in tags or 'ele' in tags))
                  )
                  if not is_obstacle:
                      return

                  h_str = tags.get('height') or tags.get('height:agl') or ''
                  elev_str = tags.get('ele') or ''
                  is_lit = tags.get('hazard:light') == 'yes' or tags.get('light:lit') == 'yes' or tags.get('aerodrome:light') == 'yes'

                  h_ft = None
                  if h_str:
                      try:
                          val = float(h_str.lower().replace('m', '').replace('ft', '').replace(',', '.').strip())
                          h_ft = round(val if 'ft' in h_str.lower() else val * 3.28084)
                      except:
                          pass

                  elev_ft = None
                  if elev_str:
                      try:
                          val = float(elev_str.lower().replace('m', '').replace('ft', '').replace(',', '.').strip())
                          elev_ft = round(val if 'ft' in elev_str.lower() else val * 3.28084)
                      except:
                          pass

                  # ICAO Rule: >= 300 ft AGL or Lit
                  if (h_ft is not None and h_ft >= 300) or (elev_ft is not None and elev_ft >= 300) or is_lit:
                      name = tags.get('name')
                      type_tag = man_made or gen_source or power or 'mast'
                      self.features.append({
                          "type": "Feature",
                          "geometry": {"type": "Point", "coordinates": [n.location.lon, n.location.lat]},
                          "properties": {
                              "id": f"osm_{n.id}",
                              "name": name if name else f"{type_tag.capitalize()} ({h_ft or ''} ft)",
                              "type": type_tag,
                              "elevation_ft": elev_ft,
                              "height_agl_ft": h_ft,
                              "country": "FI",
                              "is_lit": is_lit
                          }
                      })

          handler = ObstacleHandler()
          handler.apply_file('data/raw.osm.pbf', locations=True)
          geojson = {"type": "FeatureCollection", "features": handler.features}
          with open("obstacles_${{ matrix.code }}.geojson", "w", encoding="utf-8") as f:
              json.dump(geojson, f, indent=2)
          print(f"Successfully extracted {len(handler.features)} ICAO obstacles.")
          EOF

      - name: Update manifest.json Version Date
        run: |
          python - << 'EOF'
          import json, datetime
          with open("manifest.json", "r", encoding="utf-8") as f:
              m = json.load(f)
          for r in m.get("regions", []):
              if r.get("id") == "${{ matrix.country }}":
                  r["version"] = datetime.datetime.utcnow().strftime("%Y-%m-%d")
                  r["obstaclesUrl"] = "https://raw.githubusercontent.com/Penanen2/mapdata/refs/heads/main/obstacles_${{ matrix.code }}.geojson"
          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(m, f, indent=2)
          EOF

      - name: Upload PMTiles to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vfr-maps-latest
          name: "Latest AeroTools VFR Maps"
          files: data/${{ matrix.country }}_vfr.pmtiles
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push Updated Obstacles and Manifest
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add obstacles_${{ matrix.code }}.geojson manifest.json
          git diff-index --quiet HEAD || (git commit -m "Auto-update VFR obstacles and manifest [skip ci]" && git push)
