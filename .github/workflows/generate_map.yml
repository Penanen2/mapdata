name: Generate AeroTools VFR Maps & Obstacles

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: write

jobs:
  build_maps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - country: finland
            code: ef
            country_iso: FI
            min_lat: 59.5
            max_lat: 70.2
            min_lon: 19.0
            max_lon: 31.8
          - country: sweden
            code: sweden
            country_iso: SE
            min_lat: 55.3
            max_lat: 69.1
            min_lon: 11.0
            max_lon: 24.2

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install osmium pillow requests shapely

      - name: Create Data Directory
        run: mkdir -p data

      - name: Download Pinned Planetiler Standalone Jar
        run: |
          curl -fSL --retry 3 --max-time 120 \
            -o data/planetiler.jar \
            "https://github.com/onthegomap/planetiler/releases/download/v0.8.3/planetiler.jar"

      - name: Download OSM Data from Geofabrik
        run: |
          curl -fSL --retry 3 --retry-delay 5 --max-time 300 \
            -o data/raw.osm.pbf \
            "https://download.geofabrik.de/europe/${{ matrix.country }}-latest.osm.pbf"

      - name: Pre-process Airport Geometry Metadata & Extract ICAO Obstacles
        run: |
          python - << 'EOF'
          import json, math, osmium
          from shapely.geometry import LineString, Polygon, box

          class PreProcessor(osmium.SimpleHandler):
              def __init__(self):
                  super().__init__()
                  self.obstacles = []
                  self.airport_boxes = []
                  self.area_runways = []
                  self.centerline_runways = []
                  self.taxiway_lines = []
                  self.holding_nodes = {}
                  self.grass_candidates = []

              def _parse_ft(self, raw):
                  if not raw:
                      return None
                  try:
                      s = str(raw).lower().replace(',', '.').strip()
                      is_ft = 'ft' in s or "'" in s
                      clean = ''.join(ch for ch in s if (ch.isdigit() or ch in '.-'))
                      if not clean or clean in ('.', '-', '-.') or clean.count('.') > 1:
                          return None
                      val = float(clean)
                      return round(val if is_ft else val * 3.28084)
                  except Exception:
                      return None

              def _check_obstacle(self, tags, osm_id, lon, lat):
                  man_made = tags.get('man_made', '')
                  power = tags.get('power', '')
                  gen_source = tags.get('generator:source', '')
                  aeroway = tags.get('aeroway', '')

                  is_obs = (
                      man_made in ('mast', 'tower', 'chimney', 'communications_tower') or
                      gen_source == 'wind' or
                      aeroway == 'obstacle' or
                      (power == 'tower' and ('height' in tags or 'ele' in tags))
                  )
                  if not is_obs:
                      return

                  h_ft = self._parse_ft(tags.get('height', tags.get('height:agl', '')))
                  elev_ft = self._parse_ft(tags.get('ele', ''))
                  is_lit = (
                      tags.get('hazard:light') == 'yes' or
                      tags.get('light:lit') == 'yes' or
                      tags.get('aerodrome:light') == 'yes' or
                      tags.get('lit') == 'yes'
                  )

                  if (h_ft is not None and h_ft >= 300) or (elev_ft is not None and elev_ft >= 300) or is_lit:
                      name = tags.get('name', '')
                      type_tag = 'wind_turbine' if gen_source == 'wind' else (man_made or power or 'mast')
                      self.obstacles.append({
                          "type": "Feature",
                          "geometry": {"type": "Point", "coordinates": [round(lon, 6), round(lat, 6)]},
                          "properties": {
                              "id": f"osm_{osm_id}",
                              "name": name if name else f"{type_tag.capitalize()} ({h_ft or ''} ft)",
                              "type": type_tag,
                              "elevation_ft": elev_ft,
                              "height_agl_ft": h_ft,
                              "country": "${{ matrix.country_iso }}",
                              "is_lit": is_lit
                          }
                      })

              def node(self, n):
                  if not n.location.valid():
                      return
                  if n.tags.get('aeroway') == 'holding_position':
                      self.holding_nodes[n.id] = (n.location.lon, n.location.lat)
                  if 'man_made' in n.tags or 'generator:source' in n.tags or 'aeroway' in n.tags or 'power' in n.tags:
                      self._check_obstacle(n.tags, f"n{n.id}", n.location.lon, n.location.lat)

              def way(self, w):
                  coords = [(nd.lon, nd.lat) for nd in w.nodes if nd.location.valid()]
                  node_ids = [nd.ref for nd in w.nodes if nd.location.valid()]
                  if len(coords) < 2:
                      return

                  aeroway = w.tags.get('aeroway', w.tags.get('disused:aeroway', ''))
                  if aeroway in ('aerodrome', 'airstrip', 'runway', 'apron', 'taxiway', 'helipad'):
                      lons = [c[0] for c in coords]
                      lats = [c[1] for c in coords]
                      self.airport_boxes.append((min(lons) - 0.015, min(lats) - 0.010, max(lons) + 0.015, max(lats) + 0.010))

                  is_closed = len(coords) >= 4 and coords[0] == coords[-1]
                  is_area = is_closed and w.tags.get('area') != 'no'

                  if aeroway == 'runway':
                      if is_area:
                          lons = [c[0] for c in coords]
                          lats = [c[1] for c in coords]
                          self.area_runways.append(box(min(lons), min(lats), max(lons), max(lats)))
                      else:
                          self.centerline_runways.append(LineString(coords))
                  elif aeroway in ('taxiway', 'taxilane') and not is_area:
                      self.taxiway_lines.append((node_ids, coords))

                  if is_closed and (
                      w.tags.get('landuse') in ('grass', 'meadow') or
                      w.tags.get('natural') in ('grassland', 'scrub')
                  ):
                      lons = [c[0] for c in coords]
                      lats = [c[1] for c in coords]
                      cx = (min(lons) + max(lons)) * 0.5
                      cy = (min(lats) + max(lats)) * 0.5
                      self.grass_candidates.append((w.id, cx, cy, coords))

                  if is_closed and ('man_made' in w.tags or 'generator:source' in w.tags):
                      lons = [c[0] for c in coords]
                      lats = [c[1] for c in coords]
                      self._check_obstacle(w.tags, f"w{w.id}", sum(lons)/len(lons), sum(lats)/len(lats))

          p = PreProcessor()
          p.apply_file('data/raw.osm.pbf', locations=True)

          assert len(p.obstacles) > 50, f"Obstacle count suspiciously low: {len(p.obstacles)}"
          with open("data/obstacles_${{ matrix.code }}.geojson", "w", encoding="utf-8") as f:
              json.dump({"type": "FeatureCollection", "features": p.obstacles}, f)
          print(f"Extracted {len(p.obstacles)} ICAO obstacles.")

          hold_bearings = {}
          for node_ids, coords in p.taxiway_lines:
              for idx, nid in enumerate(node_ids):
                  if nid in p.holding_nodes:
                      p1 = coords[max(0, idx - 1)]
                      p2 = coords[min(len(coords) - 1, idx + 1)]
                      dlon = math.radians(p2[0] - p1[0])
                      lat1 = math.radians(p1[1])
                      lat2 = math.radians(p2[1])
                      y = math.sin(dlon) * math.cos(lat2)
                      x = math.cos(lat1) * math.sin(lat2) - math.sin(lat1) * math.cos(lat2) * math.cos(dlon)
                      twy_brg = (math.degrees(math.atan2(y, x)) + 360.0) % 360.0
                      hold_bearings[nid] = round((twy_brg + 90.0) % 360.0, 1)

          area_rwy_with_line = []
          for rwy_box in p.area_runways:
              if any(rwy_box.intersects(line) for line in p.centerline_runways):
                  b = rwy_box.bounds
                  area_rwy_with_line.append((b[0], b[1], b[2], b[3]))

          def in_any_airport(lon, lat, boxes):
              for b in boxes:
                  if b[0] <= lon <= b[2] and b[1] <= lat <= b[3]:
                      return True
              return False

          all_centerlines = list(p.centerline_runways) + [LineString(c) for _, c in p.taxiway_lines]
          centerline_with_bounds = [(line, line.bounds) for line in all_centerlines]

          grass_island_ids = []
          for wid, cx, cy, coords in p.grass_candidates:
              if not in_any_airport(cx, cy, p.airport_boxes):
                  continue
              try:
                  poly = Polygon(coords)
                  if not poly.is_valid:
                      poly = poly.buffer(0)
                  shrunk = poly.buffer(-0.00003)
                  if shrunk.is_empty:
                      grass_island_ids.append(wid)
                      continue
                  sb = shrunk.bounds
                  cuts_interior = False
                  for line, lb in centerline_with_bounds:
                      if not (lb[2] < sb[0] or lb[0] > sb[2] or lb[3] < sb[1] or lb[1] > sb[3]):
                          if shrunk.intersects(line):
                              cuts_interior = True
                              break
                  if not cuts_interior:
                      grass_island_ids.append(wid)
              except Exception:
                  pass

          with open("data/airport_metadata.txt", "w", encoding="utf-8") as mf:
              for b in p.airport_boxes:
                  mf.write(f"AIRPORT_BBOX|{b[0]:.5f}|{b[1]:.5f}|{b[2]:.5f}|{b[3]:.5f}\n")
              for b in area_rwy_with_line:
                  mf.write(f"AREA_RWY_WITH_LINE|{b[0]:.6f}|{b[1]:.6f}|{b[2]:.6f}|{b[3]:.6f}\n")
              for nid, brg in hold_bearings.items():
                  mf.write(f"HOLD_BEARING|{nid}|{brg}\n")
              for wid in grass_island_ids:
                  mf.write(f"GRASS_ISLAND|{wid}\n")
          print(f"Wrote metadata: {len(p.airport_boxes)} airport boxes, {len(hold_bearings)} hold bearings, {len(grass_island_ids)} grass islands.")
          EOF

      - name: Generate Clean VFR & Aerodrome PMTiles
        env:
          MAP_COUNTRY: ${{ matrix.country }}
        run: |
          java -cp data/planetiler.jar AeroToolsProfile.java

      - name: Generate Offline DEM Elevation Grid (Fail-Safe Checked)
        run: |
          python - << 'EOF'
          import json, gzip, math, io, time, requests
          from PIL import Image

          min_lat = float("${{ matrix.min_lat }}")
          max_lat = float("${{ matrix.max_lat }}")
          min_lon = float("${{ matrix.min_lon }}")
          max_lon = float("${{ matrix.max_lon }}")
          region_id = "${{ matrix.country }}"

          zoom = 7
          def deg_to_tile(lat, lon, z):
              lat_rad = math.radians(lat)
              n = 2.0 ** z
              xtile = int((lon + 180.0) / 360.0 * n)
              ytile = int((1.0 - math.asinh(math.tan(lat_rad)) / math.pi) / 2.0 * n)
              return xtile, ytile

          tile_cache = {}
          x_min, y_max_tile = deg_to_tile(min_lat, min_lon, zoom)
          x_max, y_min_tile = deg_to_tile(max_lat, max_lon, zoom)

          expected_tiles = 0
          session = requests.Session()
          for tx in range(min(x_min, x_max), max(x_min, x_max) + 1):
              for ty in range(min(y_min_tile, y_max_tile), max(y_min_tile, y_max_tile) + 1):
                  expected_tiles += 1
                  url = f"https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{zoom}/{tx}/{ty}.png"
                  for attempt in range(3):
                      try:
                          r = session.get(url, timeout=15)
                          r.raise_for_status()
                          tile_cache[(tx, ty)] = Image.open(io.BytesIO(r.content)).convert('RGB')
                          break
                      except Exception as e:
                          if attempt == 2:
                              raise e
                          time.sleep(2)

          assert len(tile_cache) == expected_tiles and expected_tiles > 0, "Failed to fetch all DEM tiles!"

          def get_elevation_m(lat, lon):
              tx, ty = deg_to_tile(lat, lon, zoom)
              img = tile_cache[(tx, ty)]
              lat_rad = math.radians(lat)
              n = 2.0 ** zoom
              fx = ((lon + 180.0) / 360.0 * n) - tx
              fy = ((1.0 - math.asinh(math.tan(lat_rad)) / math.pi) / 2.0 * n) - ty
              px = min(255, max(0, int(fx * 256)))
              py = min(255, max(0, int(fy * 256)))
              r, g, b = img.getpixel((px, py))
              elev = (r * 256 + g + b / 256.0) - 32768
              return max(0, int(round(elev)))

          step = 0.01
          lat_steps = int(round((max_lat - min_lat) / step))
          lon_steps = int(round((max_lon - min_lon) / step))
          points = []

          for i in range(lat_steps + 1):
              lat = min_lat + (i * step)
              lat_idx = int(round(lat * 100))
              for j in range(lon_steps + 1):
                  lon = min_lon + (j * step)
                  lon_idx = int(round(lon * 100))
                  elev_m = get_elevation_m(lat, lon)
                  if elev_m > 0:
                      points.append({
                          "lat_idx": lat_idx,
                          "lon_idx": lon_idx,
                          "elevation_m": elev_m
                      })

          assert len(points) > 100000, f"Elevation grid point count too low: {len(points)}"

          out_file = f"data/{region_id}_elevation.json.gz"
          payload = {
              "region_id": region_id,
              "grid_resolution_deg": step,
              "count": len(points),
              "points": points
          }
          with gzip.open(out_file, "wt", encoding="utf-8") as f:
              json.dump(payload, f)
          print(f"Exported {len(points)} elevation nodes to {out_file}")
          EOF

      - name: Upload PMTiles, Obstacles & Elevation to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vfr-maps-latest
          name: "Latest AeroTools VFR Maps"
          body: "Automated VFR Basemap + Z15 Aerodrome Charts build from commit ${{ github.sha }}."
          overwrite: true
          files: |
            data/${{ matrix.country }}_vfr.pmtiles
            data/obstacles_${{ matrix.code }}.geojson
            data/${{ matrix.country }}_elevation.json.gz
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Latest & Commit Updated Manifest
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 1. Pull latest remote commits first while tracked files are untouched
          git pull --rebase origin main

          # 2. Update manifest.json with checksums and release URLs
          python - << 'EOF'
          import json, datetime, hashlib, os

          def file_meta(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(65536), b""):
                      h.update(chunk)
              return h.hexdigest(), os.path.getsize(path)

          pm_sha, pm_size = file_meta("data/${{ matrix.country }}_vfr.pmtiles")
          obs_sha, obs_size = file_meta("data/obstacles_${{ matrix.code }}.geojson")
          elev_sha, elev_size = file_meta("data/${{ matrix.country }}_elevation.json.gz")
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          base_rel = "https://github.com/Penanen2/mapdata/releases/download/vfr-maps-latest"

          with open("manifest.json", "r", encoding="utf-8") as f:
              m = json.load(f)

          for r in m.get("regions", []):
              if r.get("id") == "${{ matrix.country }}":
                  r["version"] = today
                  r["pmtilesUrl"] = f"{base_rel}/${{ matrix.country }}_vfr.pmtiles"
                  r["pmtilesSha256"] = pm_sha
                  r["pmtilesSizeBytes"] = pm_size
                  r["obstaclesUrl"] = f"{base_rel}/obstacles_${{ matrix.code }}.geojson"
                  r["obstaclesSha256"] = obs_sha
                  r["obstaclesSizeBytes"] = obs_size
                  r["elevationUrl"] = f"{base_rel}/${{ matrix.country }}_elevation.json.gz"
                  r["elevationSha256"] = elev_sha
                  r["elevationSizeBytes"] = elev_size

          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(m, f, indent=2)
          EOF

          # 3. Commit and push manifest.json
          git add manifest.json
          git diff-index --quiet HEAD || git commit -m "Auto-update manifest for ${{ matrix.country }} [skip ci]"
          git push origin main
